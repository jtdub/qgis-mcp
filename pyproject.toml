[project]
name = "qgis-mcp"
version = "0.2.0"
description = "QGIS integration through the Model Context Protocol — introspection, styling, cartography, and spatial analysis tools"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "James Williams", email = "james.williams@jtdub.com"},
]
keywords = ["qgis", "mcp", "gis", "cartography", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "mcp[cli]>=1.12,<2",
    "typing-extensions>=4.12",
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "pylint>=3.0",
    "mypy>=1.10",
    "towncrier>=23.6",
    "invoke>=2.2",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.urls]
Documentation = "https://qgis-mcp.readthedocs.io/"
Repository = "https://github.com/jtdub/qgis-mcp"
Issues = "https://github.com/jtdub/qgis-mcp/issues"
Changelog = "https://github.com/jtdub/qgis-mcp/blob/develop/CHANGELOG.md"

[project.scripts]
qgis-mcp = "qgis_mcp.qgis_mcp_server:main"

[tool.poetry]
packages = [{ include = "qgis_mcp", from = "src" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--tb=short",
    "--strict-markers",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long
    "B904",   # raise without from in except
]

[tool.ruff.lint.per-file-ignores]
"qgis_mcp_plugin/*" = [
    "E402",   # module level import not at top
    "B905",   # zip strict= needs 3.10; this file runs on the Python inside QGIS
]
"tests/test_plugin_helpers.py" = [
    "E402",   # imports after sys.modules mocking
]
"tests/integration/*" = [
    "UP",     # this suite also runs under the Python inside a QGIS bundle
    "E402",   # imports after a version guard and importorskip
]

[tool.ruff.lint.isort]
known-first-party = ["qgis_mcp"]

[tool.pylint.main]
py-version = "3.10"
jobs = 0

[tool.pylint."messages control"]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "C0301",  # line-too-long
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "W0603",  # global-statement
    "W0707",  # raise-missing-from (handled by ruff B904)
    "W0718",  # broad-exception-caught
    "W0719",  # broad-exception-raised
    "W1203",  # logging-fstring-interpolation
    "C0103",  # invalid-name (module-level _qgis_connection)
    "R0801",  # duplicate-code
    "R0912",  # too-many-branches
    "R0917",  # too-many-positional-arguments
    "W0212",  # protected-access
]

[tool.pylint.imports]
ignored-modules = [
    "qgis",
    "qgis.core",
    "qgis.gui",
    "qgis.PyQt",
    "qgis.PyQt.QtCore",
    "qgis.PyQt.QtWidgets",
    "qgis.PyQt.QtGui",
    "qgis.utils",
    "processing",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.towncrier]
package = "qgis_mcp"
package_dir = "src"
directory = "changes"
filename = "docs/admin/release_notes/version_0.2.md"
template = "development/towncrier_template.j2"
start_string = "<!-- towncrier release notes start -->"
issue_format = "[#{issue}](https://github.com/jtdub/qgis-mcp/issues/{issue})"

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "dependencies"
name = "Dependencies"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation"
showcontent = true

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[[tool.mypy.overrides]]
module = "qgis_mcp_plugin.*"
ignore_errors = true
