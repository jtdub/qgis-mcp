---
name: Release

on:
  release:
    types: [published]

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    name: Build the package and the plugin
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Build the package
        run: poetry build

      - name: Check the tag matches the version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="v$(poetry version --short)"
          if [ "$TAG" != "$VERSION" ]; then
            echo "The tag is $TAG and pyproject.toml says $VERSION."
            exit 1
          fi

      - name: Check the plugin version matches
        run: |
          VERSION="$(poetry version --short)"
          grep -q "^version=${VERSION}$" qgis_mcp_plugin/metadata.txt
          grep -q "^PLUGIN_VERSION = \"${VERSION}\"$" qgis_mcp_plugin/qgis_mcp_plugin.py

      - name: Build the QGIS plugin zip
        run: |
          VERSION="$(poetry version --short)"
          zip -r "dist/qgis_mcp_plugin-${VERSION}.zip" qgis_mcp_plugin \
            -x '*__pycache__*' '*.pyc'
          unzip -l "dist/qgis_mcp_plugin-${VERSION}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: distfiles
          path: dist/
          if-no-files-found: error

  publish-github:
    name: Attach the files to the release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distfiles
          path: dist/

      - name: Upload the files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.ref_name }}" dist/*.whl dist/*.tar.gz dist/*.zip

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      # Trusted Publishing needs this. No API token is stored.
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distfiles
          path: dist/

      - name: Remove the plugin zip
        run: rm -f dist/*.zip

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-qgis-plugin:
    name: Publish to the QGIS Plugin Repository
    runs-on: ubuntu-latest
    needs: build
    environment: osgeo
    env:
      OSGEO_USERNAME: ${{ secrets.OSGEO_USERNAME }}

    steps:
      - name: Report when no OSGeo account is configured
        if: env.OSGEO_USERNAME == ''
        run: |
          echo "OSGEO_USERNAME is not set."
          echo "Nothing is uploaded to plugins.qgis.org."
          echo "Attach the plugin zip from the GitHub release by hand, or set the secret."

      - uses: actions/download-artifact@v4
        if: env.OSGEO_USERNAME != ''
        with:
          name: distfiles
          path: dist/

      - name: Upload the plugin
        if: env.OSGEO_USERNAME != ''
        env:
          OSGEO_PASSWORD: ${{ secrets.OSGEO_PASSWORD }}
        run: |
          ZIP="$(ls dist/qgis_mcp_plugin-*.zip)"
          curl --fail --show-error --silent \
            --user "${OSGEO_USERNAME}:${OSGEO_PASSWORD}" \
            --form "package=@${ZIP}" \
            https://plugins.qgis.org/plugins/add/

  advance-main:
    name: Move main to the released commit
    runs-on: ubuntu-latest
    needs: [publish-github, publish-pypi]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push the released commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # This push is deliberately not forced. It fails when main and the
          # released commit share no history, which is true until someone seeds
          # main once. The release itself has already succeeded by this point.
          if git push origin "${{ github.sha }}:refs/heads/main"; then
            echo "main now points at ${{ github.sha }}."
          else
            echo "Could not move main."
            echo "main is an orphan branch until someone seeds it from develop."
            echo "Read docs/dev/release_checklist.md."
            exit 1
          fi
