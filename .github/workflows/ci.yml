name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run tests
        run: poetry run pytest -v --tb=short

      - name: Run tests with coverage
        if: matrix.python-version == '3.10'
        run: poetry run pytest --cov=src/qgis_mcp --cov-report=term-missing

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pipx install poetry

      - name: Check pyproject and the lock file agree
        run: poetry check --lock

      - name: Install dependencies
        run: poetry install --with dev

      - name: Ruff check
        run: poetry run ruff check .

      - name: Ruff format check
        run: poetry run ruff format --check .

      - name: Pylint
        run: poetry run pylint src/qgis_mcp/

      - name: Mypy
        run: poetry run mypy src/qgis_mcp/

  integration:
    name: Integration (QGIS)
    runs-on: ubuntu-latest
    container:
      image: qgis/qgis:ltr
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          python3 -m venv --system-site-packages /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip
          /tmp/venv/bin/pip install pytest pytest-asyncio "mcp[cli]>=1.12,<2"

      - name: Run integration tests
        run: /tmp/venv/bin/python -m pytest tests/integration -c tests/integration/pytest.ini -v

  changelog:
    name: Change fragment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that the pull request adds a fragment
        run: |
          types="security|added|changed|deprecated|removed|fixed|dependencies|documentation"
          added=$(git diff --name-only --diff-filter=A \
            "origin/${{ github.base_ref }}...HEAD" \
            | grep -E "^changes/[0-9]+\.($types)$" || true)
          if [ -z "$added" ]; then
            echo "No change fragment found under changes/."
            echo "Add one named <issue>.<type>, or apply the no-changelog label."
            echo "See docs/dev/changelog_fragments.md."
            exit 1
          fi
          echo "Found:"
          echo "$added"

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --with docs

      - name: Build the site
        run: poetry run mkdocs build --strict
