---
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # Run poetry through the interpreter Read the Docs built, not through a
    # bare `poetry` on PATH. A bare one installs into the global Python, and
    # `python -m mkdocs` then cannot see the theme.
    post_install:
      - python -m pip install poetry
      - python -m poetry config virtualenvs.create false
      - python -m poetry install --with docs

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
