---
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # This replaces the default install step. Read the Docs otherwise runs its
    # own `pip install --upgrade mkdocs` first, which lands a different mkdocs
    # than the lock file pins, and the theme then fails to register.
    install:
      - python -m pip install poetry
      - python -m poetry config virtualenvs.create false
      - python -m poetry install --with docs
      - python -m pip list

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
