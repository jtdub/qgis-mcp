---
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # This replaces the default install step, so poetry alone decides what is
    # installed. `poetry env use python` binds poetry to the interpreter Read
    # the Docs built. Without it, poetry installs into a cached environment of
    # its own and the build finds no mkdocs at all.
    install:
      - python -m pip install poetry
      - python -m poetry env use python
      - python -m poetry install --with docs
      - python -m pip list

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
