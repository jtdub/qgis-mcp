---
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # This replaces the default install step. The docs dependencies are a
    # standard extra in pyproject.toml, so pip installs them with no help from
    # poetry. Poetry never targets the interpreter Read the Docs builds, and
    # installs into a cached environment of its own instead.
    install:
      - python -m pip install ".[docs]"

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
